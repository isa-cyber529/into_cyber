[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "into-cyber"
version = "0.1.0"
description = "A safe, local security-awareness scanner for common insecure patterns"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
into-cyber = "into_cyber.security_checker:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
